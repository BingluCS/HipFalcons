[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hipfalcons"
version = "0.1.0"
description = "HIP decompression and a PyTorch DataLoader for CPU Falcons streams"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["h5py>=3.8", "numpy>=1.24"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
